name: Swaply CI & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  regression-tests:
    name: Run Unit & Regression Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Execute 48 Unit & Regression Tests
        run: npm test

      - name: Validate Manifest V3 Structure
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            if (manifest.manifest_version !== 3) throw new Error('Must be Manifest V3');
            if (!manifest.permissions.includes('cookies')) throw new Error('Missing cookies permission');
            if (!manifest.permissions.includes('declarativeNetRequest')) throw new Error('Missing declarativeNetRequest permission');
            console.log('Manifest V3 validation passed');
          "

  playwright-e2e:
    name: Playwright Chrome Extension E2E
    runs-on: ubuntu-latest
    needs: regression-tests

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers with Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  package-release:
    name: Package Store Artifact
    needs: playwright-e2e
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Create Production Bundle
        run: |
          mkdir -p dist
          cp manifest.json popup.html popup.css popup.js background.js devtools.html devtools.js panel.html panel.css panel.js dist/
          zip -r qaswitch-release.zip dist/*

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qaswitch-chromewebstore-bundle
          path: qaswitch-release.zip
